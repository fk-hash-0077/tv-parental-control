org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# The version people see on the phone and TV. Bump the number after the dot for each update
# (1.0, 1.1, 1.2 ...). The hidden build number (versionCode) comes from CI and always goes up,
# so updates still install over older versions.
appVersionName=1.0

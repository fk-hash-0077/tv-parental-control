name: Build APKs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      # Becomes the apps' version number, so the TV can tell which release is newer.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test cloud functions
        working-directory: functions
        run: |
          npm ci --no-audit --no-fund
          node --test

      - name: Add Firebase config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON" > tv/google-services.json
          printf '%s' "$GOOGLE_SERVICES_JSON" > phone/google-services.json

      - name: Build
        run: ./gradlew --no-daemon :tv:testDebugUnitTest :tv:assembleDebug :phone:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: tv-guard-apks
          path: |
            tv/build/outputs/apk/debug/tv-debug.apk
            phone/build/outputs/apk/debug/phone-debug.apk

      # The TV's "Update TV" button installs tv-debug.apk from the latest release.
      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.GOOGLE_SERVICES_JSON != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$BUILD_NUMBER" \
            tv/build/outputs/apk/debug/tv-debug.apk \
            phone/build/outputs/apk/debug/phone-debug.apk \
            --title "TV Guard version $BUILD_NUMBER" \
            --notes "Built from ${GITHUB_SHA::7}. Install phone-debug.apk on your phone; the TV updates itself from the phone's Update TV button."

  # Deploys the database rules and the notification functions. Runs only once the
  # FIREBASE_SERVICE_ACCOUNT secret is added (see SETUP), and only from main.
  deploy-firebase:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && env.GOOGLE_SERVICES_JSON != ''

      - uses: actions/setup-node@v4
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && env.GOOGLE_SERVICES_JSON != ''
        with:
          node-version: "22"

      - name: Deploy
        if: env.FIREBASE_SERVICE_ACCOUNT != '' && env.GOOGLE_SERVICES_JSON != ''
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          project=$(printf '%s' "$GOOGLE_SERVICES_JSON" | jq -r '.project_info.project_id')
          url=$(printf '%s' "$GOOGLE_SERVICES_JSON" | jq -r '.project_info.firebase_url // empty')
          if [ -z "$url" ]; then
            echo "google-services.json has no firebase_url. Download it again after creating the Realtime Database." >&2
            exit 1
          fi
          host=${url#https://}
          host=${host%%/*}
          instance=${host%%.*}
          case "$host" in
            *.firebasedatabase.app) region=$(echo "$host" | cut -d. -f2) ;;
            *) region=us-central1 ;;
          esac
          printf '{"instance":"%s","region":"%s"}\n' "$instance" "$region" > functions/database.json
          echo "Deploying to $project (database $instance in $region)"
          (cd functions && npm ci --no-audit --no-fund)
          npx --yes firebase-tools@13.35.1 deploy --only functions,database \
            --project "$project" --non-interactive --force
